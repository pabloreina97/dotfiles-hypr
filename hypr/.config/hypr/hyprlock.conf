# Hyprlock - Estilo informativo limpio
# Tipografía: Sora | Layout: centrado con info compacta

source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$Scripts = $HOME/.config/hypr/scripts

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
}

# Background - imagen dedicada para lockscreen
# Para cambiar el fondo: reemplaza ~/.config/hypr/lockscreen_bg
# (actualmente es un symlink al wallpaper del escritorio)
background {
    monitor =
    path = $HOME/.config/hypr/lockscreen_bg
    color = rgb(0, 0, 0)

    blur_size = 5
    blur_passes = 3
    noise = 0.01
    contrast = 1.1
    brightness = 0.65
    vibrancy = 0.2
    vibrancy_darkness = 0.1
}

# Hora
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 0.95)
    font_size = 140
    font_family = Sora ExtraBold
    position = 0, 200
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:18000000] echo "$(date +'%A, %-d %B')"
    color = rgba(255, 255, 255, 0.7)
    font_size = 28
    font_family = Sora SemiBold
    position = 0, 30
    halign = center
    valign = center
}

# Usuario
label {
    monitor =
    text =   $USER
    color = rgba(255, 255, 255, 0.85)
    font_size = 24
    font_family = Sora SemiBold
    position = 0, 280
    halign = center
    valign = bottom
}

# Input field - glassmorphism
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.15)
    inner_color = rgba(255, 255, 255, 0.08)
    capslock_color = rgba(255, 200, 50, 0.9)
    font_color = rgba(255, 255, 255, 0.9)
    fade_on_empty = false
    font_family = Sora
    placeholder_text = <span foreground="##ffffff80">Contraseña</span>
    hide_input = false
    rounding = 12
    position = 0, 200
    halign = center
    valign = bottom
}

# Weather - línea compacta (icono + condición + temp + ciudad)
label {
    monitor =
    text = cmd[update:3600000] [ -f "$HOME/.cache/.weather_cache" ] && cat "$HOME/.cache/.weather_cache"
    color = rgba(255, 255, 255, 0.6)
    font_size = 14
    font_family = Sora
    position = 30, 15
    halign = left
    valign = bottom
}

# Uptime
label {
    monitor =
    text = cmd[update:60000] echo "$(uptime -p)"
    color = rgba(255, 255, 255, 0.4)
    font_size = 14
    font_family = Sora
    position = -30, 15
    halign = right
    valign = bottom
}
